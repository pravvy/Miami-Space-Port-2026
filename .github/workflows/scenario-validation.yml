name: Scenario validation

on:
  push:
    paths:
      - "scenarios/**"
      - "scripts/validate_scenarios.py"
      - ".github/workflows/scenario-validation.yml"
  pull_request:
    paths:
      - "scenarios/**"
      - "scripts/validate_scenarios.py"
      - ".github/workflows/scenario-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate scenario definitions
        run: python scripts/validate_scenarios.py
